# DF-USA-Multi-Tenant-Orchestrator Configuration [CRUX-MK]
df_id: DF-USA-MULTI-TENANT-ORCHESTRATOR
df_name: usa-multi-tenant-orchestrator
welle_introduced: welle-51
version: 0.1.0-SKELETON
status: PRE-PRODUCTION-CONDITIONAL
type: foundation-df
crux-mk: true

k0_touch: true
q0_touch: true
phronesis_required: true
sandbox_default: true
country_code: "US"
jurisdiction: "Federal+California"

description: |
  Multi-Tenant-Boundary fuer DE+USA-Hotels mit DSGVO (EU) + CCPA (California) Compliance.
  Tenant-Context per Country + Hotel-ID. Foundation fuer USA-Markt-Expansion.

# === Default-Action (per ausreden-schutz.md Schicht 2, Welle-47 Migration Batch-2) ===
default_action:
  description: "USA+DE Multi-Tenant-Orchestration mit dual-jurisdiction Compliance (DSGVO+CCPA), Country-Code Routing, Government-Records Anker-Validation pro Tenant"
  rho_per_run_eur: 60
  rho_validation_source: unvalidated
  block_gates:
    - gate_id: K11
      block_reason: "Cascade-Containment: isolated_dlq_per_tenant Pflicht (USA-Hotels duerfen nicht in DE-DLQ schreiben)"
      false_block_cost_eur: 50
      legitimate_block_condition: "Cross-Jurisdiction-Tenant-Leak detected"
    - gate_id: K13_PAV
      block_reason: "Pre-Action-Verification: jurisdiction (DE/CA) + env_tag + blast_radius Pflicht, sandbox_default=true"
      false_block_cost_eur: 40
      legitimate_block_condition: "k0_q0_touch=true ohne PHRONESIS_TICKET (Hotel-Expansion-Decisions)"
    - gate_id: K14
      block_reason: "Phronesis-Required (USA-Markt-Expansion = K_0+Q_0)"
      false_block_cost_eur: 80
      legitimate_block_condition: "Real-Mode ohne Martin-Phronesis-Approval"
  graceful_degradation_path: "Sandbox-Mock-Tenant-Dispatch (kein Real-Cross-Country-State-Mutation), Read-only-Jurisdiction-Mapping"

acceptance_criteria:
  K11_cascade_containment:
    cascade_isolation: "hard"
    failure_blast_radius: 0
    dependency_dlq_strategy: "isolated_dlq_per_tenant"
  K12_distillation_resistenz:
    output_feeds_into_training: false
    provenance_required_in_output: true
    non_llm_validation_layer: true
  K13_independent_ground_truth:
    external_anchor_type: "government_records"
    external_anchor_validation_frequency: "daily"
    pre_action_domain_check: true
    pre_action_backup_check: true
    pre_action_blast_radius_check: true
  K14_human_override_decay:
    override_complexity: "multi_step"
    override_documentation_freshness_days: 30
    martin_review_cadence: "weekly"
    bus_factor_handover_drilled: false
  K15_entropy_budget:
    entropy_added_loc_estimate: 950
    entropy_added_concepts:
      - TenantContext
      - CountryBoundary
      - DSGVO-CCPA-DualCompliance
    entropy_justified_by_rho: "Foundation fuer USA-Markt + Cape-Coral-Relocation"
    entropy_subtractive_potential: "Konsolidiert DE+US Multi-Tenant in 1 Pipeline"
  K16_concurrent_spawn_mutex:
    concurrent_spawn_protection: "both"
    lock_dir: "/tmp/df-usa-multi-tenant-orchestrator.lock"
    lock_stale_age_h: 6
    engine_pgrep_check: true
    lock_release_on: "EXIT_INT_TERM"

lose_coupling:
  LC1_graceful_degradation:
    degradation_modes:
      - full
      - degraded_no_real_db
      - sandbox_mock
    degradation_test_required: true
  LC2_direct_mode:
    direct_mode_available: true
    direct_mode_capability: 0.6
    direct_mode_trigger: "real_db_unreachable_30s"
  LC3_circuit_breaker:
    circuit_breaker_timeout_s: 30
    circuit_breaker_open_threshold: 3
    circuit_breaker_half_open_test_interval_s: 300
  LC4_failure_isolation:
    state_externalization: true
    idempotent_operations: true
    dependency_dlq_separate: true
  LC5_health_check:
    health_check_dependencies: []
    health_check_degraded_score: 0.6
    health_check_endpoint_or_file: "state/df-usa-multi-tenant-health.json"

activation:
  default_mode: "sandbox"
  env_var_real_mode: "DF_USA_MULTI_TENANT_REAL_ENABLED"
  phronesis_ticket_env: "PHRONESIS_TICKET"
  phronesis_required_for: "real_multi_tenant_provisioning"
  pre_run_check_pflicht: true
  cost_estimate_required: true
  quota_budget_ceiling_calls_per_run: 30
  cost_overrun_action: "hard_stop"

cross_df:
  upstream: []
  downstream:
    - df-florida-hotel-acquisition-tracker
    - df-usa-cross-border-tax-optimizer
    - df-usa-9os-coupling-validator
    - df-usa-marketplace-aggregator

shared_modules:
  - _df_common/adapter_base
  - _df_common/atomic_lock
  - _df_common/k0_phronesis_gate

[CRUX-MK]
